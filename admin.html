<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【管理用】順番呼び出しパネル</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 500px; margin: 0 auto; padding: 20px; background: #0f172a; color: #f8fafc; }
    .card { background: #1e293b; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: center; }
    h1 { font-size: 18px; color: #94a3b8; margin-bottom: 15px; }
    
    .shop-select { width: 100%; padding: 12px; font-size: 16px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; margin-bottom: 15px; }
    .input-line-id { width: 100%; padding: 10px; font-size: 14px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; margin-bottom: 20px; }

    .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    .status-card { background: #0f172a; padding: 15px; border-radius: 12px; }
    .status-title { font-size: 12px; color: #64748b; font-weight: bold; }
    .status-num { font-size: 36px; font-weight: bold; color: #38bdf8; margin-top: 5px; }

    /* 操作ボタンエリア */
    .btn-next { background: #22c55e; color: white; border: none; padding: 18px; font-size: 20px; font-weight: bold; border-radius: 14px; cursor: pointer; width: 100%; box-shadow: 0 4px 15px rgba(34,197,94,0.3); margin-bottom: 12px; }
    .btn-skip { background: #f59e0b; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; margin-bottom: 20px; }
    .btn-qr { background: #3b82f6; color: white; border: none; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-next:active, .btn-skip:active, .btn-qr:active { transform: scale(0.98); }

    /* スキップリスト表示エリア */
    .skipped-box { background: #0f172a; padding: 15px; border-radius: 12px; text-align: left; margin-bottom: 20px; border: 1px dashed #334155; }
    .skipped-title { font-size: 13px; color: #f59e0b; font-weight: bold; margin-bottom: 10px; display: flex; justify-content: space-between; }
    .skipped-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .skip-tag { background: #f59e0b22; color: #fbbf24; border: 1px solid #f59e0b; padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 6px; }
    .skip-tag button { background: #ef4444; color: white; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* モーダル共通スタイル */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #fff; color: #1e293b; padding: 25px; border-radius: 20px; text-align: center; max-width: 380px; width: 90%; box-sizing: border-box; }
    
    /* 呼び出しモーダル専用スタイル */
    .modal-call-content { background: #1e293b; color: #f8fafc; text-align: left; border: 1px solid #334155; }
    .call-option-box { background: #0f172a; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; }
    .call-option-title { font-size: 12px; color: #94a3b8; font-weight: bold; margin-bottom: 8px; }
    .direct-input-group { display: flex; gap: 8px; }
    .direct-input-group input { flex: 1; padding: 10px; font-size: 16px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; }
    .btn-call-sub { background: #3b82f6; color: white; border: none; padding: 10px 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }

    .qr-container { background: #fff; padding: 15px; display: inline-block; border-radius: 12px; margin: 15px 0; border: 1px solid #e2e8f0; }
    .btn-print { background: #0f172a; color: white; border: none; padding: 12px 24px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-right: 8px; }
    .btn-close { background: #64748b; color: white; border: none; padding: 12px 20px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }

    .btn-reset { background: #ef4444; color: white; border: none; padding: 10px; font-size: 12px; border-radius: 8px; cursor: pointer; opacity: 0.6; }
    .status-msg { margin-top: 15px; font-size: 13px; color: #f59e0b; }

    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: absolute; left: 0; top: 0; width: 100%; text-align: center; color: #000; background: #fff; padding: 40px 0; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🛠️ 店舗運営・呼び出しパネル</h1>

    <select class="shop-select" id="shopSelect" onchange="switchShop()">
      <option value="shop1">店舗1</option>
      <option value="shop2">店舗2</option>
      <option value="shop3">店舗3</option>
    </select>

    <!-- 個別呼び出し用 LINE User ID 入力欄 -->
    <input type="text" class="input-line-id" id="lineUserId" placeholder="通知先 LINE User ID (自動入力されます)">

    <button class="btn-qr" onclick="openQRModal()">📱 店舗用QRコードを表示・印刷</button>

    <div class="status-grid">
      <div class="status-card">
        <div class="status-title">現在呼び出し中</div>
        <div class="status-num" id="currentNum">0 番</div>
      </div>
      <div class="status-card">
        <div class="status-title">本日発行数</div>
        <div class="status-num" id="maxNum" style="color: #a855f7;">0 番</div>
      </div>
    </div>

    <!-- メイン操作ボタン（呼び出しモーダルを開く） -->
    <button class="btn-next" onclick="openCallModal()">📢 呼び出しパネルを開く</button>
    <button class="btn-skip" onclick="skipCustomer()">⚠️ 不在のためスキップ（保留）</button>

    <!-- スキップ（不在）リスト -->
    <div class="skipped-box">
      <div class="skipped-title">
        <span>📋 不在・スキップ中の番号</span>
        <span style="font-size: 11px; color: #64748b;">（戻られたら削除）</span>
      </div>
      <div class="skipped-tags" id="skipList">
        <span style="font-size: 12px; color: #64748b;">なし</span>
      </div>
    </div>

    <div id="statusMsg" class="status-msg"></div>

    <div style="margin-top: 25px; text-align: right;">
      <button class="btn-reset" onclick="resetQueue()">🔄 本日の番号リセット</button>
    </div>
  </div>

  <!-- 💡 新設：呼び出し選択モーダル -->
  <div class="modal" id="callModal">
    <div class="modal-content modal-call-content">
      <h2 style="font-size: 18px; margin-top: 0; color: #f8fafc; border-bottom: 1px solid #334155; padding-bottom: 10px;">📢 呼び出し番号の選択</h2>
      
      <!-- ① 次の順番を呼ぶ -->
      <div class="call-option-box">
        <div class="call-option-title">次の順番の方を呼び出す</div>
        <button class="btn-next" style="font-size: 16px; padding: 12px; margin-bottom: 0;" onclick="callNextCustomer()">
          <span id="nextCallBtnText">次の方を呼び出す</span>
        </button>
      </div>

      <!-- ② 番号を直接指定して呼ぶ -->
      <div class="call-option-box">
        <div class="call-option-title">番号を直接指定して呼び出す</div>
        <div class="direct-input-group">
          <input type="number" id="customNumInput" placeholder="例: 8">
          <button class="btn-call-sub" onclick="callCustomNumber()">呼び出し</button>
        </div>
      </div>

      <!-- ③ スキップ（不在）中の番号から選んで呼ぶ -->
      <div class="call-option-box" style="margin-bottom: 0;">
        <div class="call-option-title">不在リストから再呼び出し</div>
        <div class="skipped-tags" id="modalSkipList">
          <span style="font-size: 12px; color: #64748b;">不在中の番号はありません</span>
        </div>
      </div>

      <button class="btn-close" onclick="closeCallModal()">閉じる</button>
    </div>
  </div>

  <!-- QRコードモーダル画面 -->
  <div class="modal" id="qrModal">
    <div class="modal-content" id="printArea">
      <h2 style="font-size: 22px; margin-bottom: 5px;" id="modalShopName">順番待ち受付</h2>
      <p style="font-size: 13px; color: #64748b; margin-top: 0;">スマホでQRコードを読み取って<br>整理券を発行してください</p>
      
      <div class="qr-container">
        <div id="qrcode"></div>
      </div>

      <div style="font-size: 11px; color: #94a3b8; word-break: break-all; margin-bottom: 15px;" id="targetUrl"></div>

      <div class="no-print">
        <button class="btn-print" onclick="window.print()">🖨️ 印刷する</button>
        <button class="btn-close" style="background:#94a3b8; width:auto;" onclick="closeQRModal()">閉じる</button>
      </div>
    </div>
  </div>

  <!-- Firebase & QR Code SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAtWL5QTMOKHUZfb9MZoAt4NtBue2SNd7E",
      authDomain: "qr-customer-call.firebaseapp.com",
      projectId: "qr-customer-call",
      storageBucket: "qr-customer-call.firebasestorage.app",
      messagingSenderId: "809125472107",
      appId: "1:809125472107:web:f25fd8367ab69728bc8a7e",
      measurementId: "G-VT8ZHEXYMX"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentShopId = 'shop1';
    let unsubscribe = null;
    let shopDataCache = { current: 0, max: 0, skips: [], userIds: {} };

    function switchShop() {
      currentShopId = document.getElementById('shopSelect').value;
      if (unsubscribe) unsubscribe();

      const ref = db.collection('queueShops').doc(currentShopId);
      unsubscribe = ref.onSnapshot(doc => {
        if (!doc.exists) {
          ref.set({ name: '店舗', current: 0, max: 0, skips: [], userIds: {} });
          return;
        }
        const data = doc.data();
        shopDataCache = data; // キャッシュ更新
        
        document.getElementById('currentNum').innerText = `${data.current || 0} 番`;
        document.getElementById('maxNum').innerText = `${data.max || 0} 番`;
        renderSkips(data.skips || []);
        updateModalCallInfo();
        showMsg("");
      }, error => {
        console.error("Firestore Error:", error);
        showMsg("❌ データベース接続エラーです。");
      });
    }

    // LINE通知送信関数
    async function sendLineNotification(ticketNumber) {
      const select = document.getElementById('shopSelect');
      const shopName = select.options[select.selectedIndex].text;
      const lineUserId = document.getElementById('lineUserId').value.trim();

      if (!lineUserId) {
        showMsg(`📢 番号 ${ticketNumber} 番を呼び出しました（LINE ID未連携のため通知なし）`);
        return;
      }

      try {
        const res = await fetch('/api/notify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ shopName, ticketNumber, lineUserId })
        });

        if (res.ok) {
          showMsg(`✅ 番号 ${ticketNumber} 番へLINE通知を送信しました！`);
        } else {
          const errData = await res.json();
          showMsg(`⚠️ LINE送信失敗: ${JSON.stringify(errData)}`);
        }
      } catch (err) {
        showMsg('❌ 通信エラーでLINE通知が送信できませんでした');
      }
    }

    // 💡 指定された番号を更新してLINE通知を送るコア処理
    function executeCall(targetNum) {
      const ref = db.collection('queueShops').doc(currentShopId);
      let targetUserId = null;

      db.runTransaction(transaction => {
        return transaction.get(ref).then(doc => {
          if (!doc.exists) return;
          const userIds = doc.data().userIds || {};
          let skips = doc.data().skips || [];

          targetUserId = userIds[targetNum] || null;
          // もし呼び出した番号がスキップリストにあれば自動除外
          skips = skips.filter(n => n !== targetNum);

          transaction.update(ref, { current: targetNum, skips: skips });
          return targetNum;
        });
      }).then(num => {
        if (num) {
          document.getElementById('lineUserId').value = targetUserId || "";
          sendLineNotification(num);
          closeCallModal();
        }
      });
    }

    // 1. 次の方を順次呼び出す
    function callNextCustomer() {
      const current = shopDataCache.current || 0;
      const max = shopDataCache.max || 0;

      if (current < max) {
        executeCall(current + 1);
      } else {
        alert("待っているお客さまはいません。");
      }
    }

    // 2. 直接入力された番号を呼び出す
    function callCustomNumber() {
      const input = document.getElementById('customNumInput');
      const num = parseInt(input.value, 10);
      if (!num || num <= 0) {
        alert("正しい番号を入力してください。");
        return;
      }
      executeCall(num);
      input.value = "";
    }

    // モーダル開閉制御
    function openCallModal() {
      updateModalCallInfo();
      document.getElementById('callModal').style.display = 'flex';
    }

    function closeCallModal() {
      document.getElementById('callModal').style.display = 'none';
    }

    function updateModalCallInfo() {
      const current = shopDataCache.current || 0;
      const max = shopDataCache.max || 0;
      const nextNum = current + 1;

      const btnText = document.getElementById('nextCallBtnText');
      if (current < max) {
        btnText.innerText = `【${nextNum} 番】を順番通り呼び出す`;
      } else {
        btnText.innerText = `次の方はいません（本日最大: ${max}番）`;
      }

      // モーダル内の不在リスト描画
      const container = document.getElementById('modalSkipList');
      const skips = shopDataCache.skips || [];
      if (skips.length === 0) {
        container.innerHTML = '<span style="font-size: 12px; color: #64748b;">不在中の番号はありません</span>';
      } else {
        container.innerHTML = skips.map(num => `
          <button class="skip-tag" style="cursor:pointer;" onclick="executeCall(${num})">
            ${num} 番を呼ぶ
          </button>
        `).join('');
      }
    }

    // スキップ処理
    function skipCustomer() {
      const ref = db.collection('queueShops').doc(currentShopId);
      db.runTransaction(transaction => {
        return transaction.get(ref).then(doc => {
          if (!doc.exists) return;
          const current = doc.data().current || 0;
          const max = doc.data().max || 0;
          let skips = doc.data().skips || [];

          if (current === 0) {
            showMsg("⚠️ まだ誰も呼び出されていません。");
            return;
          }

          if (!skips.includes(current)) skips.push(current);

          const nextNum = current < max ? current + 1 : current;
          transaction.update(ref, { skips: skips, current: nextNum });
        });
      }).then(() => showMsg("番号をスキップリストへ移動しました"));
    }

    // スキップ解除
    function removeSkip(num) {
      const ref = db.collection('queueShops').doc(currentShopId);
      db.runTransaction(transaction => {
        return transaction.get(ref).then(doc => {
          if (!doc.exists) return;
          let skips = doc.data().skips || [];
          skips = skips.filter(n => n !== num);
          transaction.update(ref, { skips: skips });
        });
      });
    }

    // QRコードモーダル表示
    function openQRModal() {
      const select = document.getElementById('shopSelect');
      const shopName = select.options[select.selectedIndex].text;
      const targetUrl = `https://liff.line.me/2011502822-9gjbFKnE?shop=${currentShopId}`;

      document.getElementById('modalShopName').innerText = `${shopName} 順番待ち受付`;
      document.getElementById('targetUrl').innerText = targetUrl;
      document.getElementById('qrcode').innerHTML = "";

      new QRCode(document.getElementById('qrcode'), {
        text: targetUrl,
        width: 180,
        height: 180
      });

      document.getElementById('qrModal').style.display = 'flex';
    }

    function closeQRModal() {
      document.getElementById('qrModal').style.display = 'none';
    }

    function renderSkips(skips) {
      const container = document.getElementById('skipList');
      if (skips.length === 0) {
        container.innerHTML = '<span style="font-size: 12px; color: #64748b;">なし</span>';
        return;
      }
      container.innerHTML = skips.map(num => `
        <div class="skip-tag">
          ${num} 番
          <button onclick="removeSkip(${num})">✕</button>
        </div>
      `).join('');
    }

    function resetQueue() {
      if (confirm('本日のデータをリセット（0番に戻す）しますか？')) {
        db.collection('queueShops').doc(currentShopId).set({ name: '店舗', current: 0, max: 0, skips: [], userIds: {} });
      }
    }

    function showMsg(text) {
      document.getElementById('statusMsg').innerText = text;
    }

    switchShop();
  </script>
</body>
</html>
